spring:
  application:
    name: openemr2026-clinical-core
  datasource:
    url: ${OPENEMR2026_DB_URL:jdbc:postgresql://127.0.0.1:55432/openemr2026_dev}
    username: ${OPENEMR2026_DB_USER:liuhaoxian}
    password: ${OPENEMR2026_DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    property-naming-strategy: SNAKE_CASE

server:
  port: ${OPENEMR2026_SERVER_PORT:8080}

openemr2026:
  version: 0.1.0-SNAPSHOT
  archive:
    storage-root: ${OPENEMR2026_ARCHIVE_STORAGE_ROOT:${java.io.tmpdir}/openemr2026-archive-objects}
    ocr-endpoint: ${OPENEMR2026_ARCHIVE_OCR_ENDPOINT:}
    cda-validation-endpoint: ${OPENEMR2026_ARCHIVE_CDA_VALIDATION_ENDPOINT:}
    malware-scanner:
      host: ${OPENEMR2026_ARCHIVE_MALWARE_SCANNER_HOST:}
      port: ${OPENEMR2026_ARCHIVE_MALWARE_SCANNER_PORT:3310}
      timeout-millis: ${OPENEMR2026_ARCHIVE_MALWARE_SCANNER_TIMEOUT_MILLIS:10000}
  security:
    emergency-reauthentication-max-age-seconds: 300
  outbox:
    enabled: false
    batch-size: 50
    lease-seconds: 30
    max-attempts: 5
    poll-delay-ms: 1000
  task-center:
    notification-scheduler-enabled: ${OPENEMR2026_TASK_NOTIFICATION_SCHEDULER_ENABLED:true}
    notification-poll-delay-ms: ${OPENEMR2026_TASK_NOTIFICATION_POLL_DELAY_MS:5000}
  medical-agent:
    external-models-enabled: ${OPENEMR2026_MEDICAL_AGENT_EXTERNAL_MODELS_ENABLED:true}
    worker:
      enabled: true
      lease-seconds: 180
      poll-delay-ms: 500
  model-secrets:
    directory: ${OPENEMR2026_MODEL_SECRET_DIRECTORY:${java.io.tmpdir}/openemr2026-model-secrets}
