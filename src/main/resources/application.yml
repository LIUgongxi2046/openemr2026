spring:
  application:
    name: openemr2026-clinical-core
  datasource:
    url: ${OPENEMR2026_DB_URL:jdbc:postgresql://127.0.0.1:55432/openemr2026_dev}
    username: ${OPENEMR2026_DB_USER:liuhaoxian}
    password: ${OPENEMR2026_DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    property-naming-strategy: SNAKE_CASE

server:
  port: ${OPENEMR2026_SERVER_PORT:8080}

openemr2026:
  version: 0.1.0-SNAPSHOT
  security:
    emergency-reauthentication-max-age-seconds: 300
  outbox:
    enabled: false
    batch-size: 50
    lease-seconds: 30
    max-attempts: 5
    poll-delay-ms: 1000
