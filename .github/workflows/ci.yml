name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  full-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.0-bookworm
        env:
          POSTGRES_DB: openemr2026_dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d openemr2026_dev"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      OPENEMR2026_DB_URL: jdbc:postgresql://127.0.0.1:55432/openemr2026_dev
      OPENEMR2026_DB_USER: postgres
      OPENEMR2026_DB_PASSWORD: postgres
      OPENEMR2026_PG_BIN: /usr/lib/postgresql/18/bin
      OPENEMR2026_PG_SOCKET: 127.0.0.1
      OPENEMR2026_PG_PORT: 55432
      OPENEMR2026_PG_DATABASE: openemr2026_dev
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.13.0"
          cache: npm
          cache-dependency-path: |
            contracts/package-lock.json
            web/package-lock.json
      - name: Install PostgreSQL 18 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-18
      - run: npm ci --prefix contracts
      - run: npm ci --prefix web
      - name: Install Chromium for route audit
        working-directory: web
        run: npx playwright install --with-deps chromium
      - run: ./gradlew --version
      - run: scripts/verify.sh
      - name: Start synthetic backend and Vue app
        run: |
          nohup ./gradlew bootRun --args='--spring.profiles.active=dev-synthetic' > /tmp/openemr2026-backend.log 2>&1 &
          nohup npm --prefix web run dev > /tmp/openemr2026-web.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4177/ >/dev/null && curl --silent http://127.0.0.1:8080/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          tail -n 100 /tmp/openemr2026-backend.log
          tail -n 100 /tmp/openemr2026-web.log
          exit 1
      - name: Audit all 194 production routes in Chromium
        run: npm --prefix web run test:routes:browser
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          if-no-files-found: ignore
          path: |
            build/test-results/test/
            build/reports/tests/test/
            web/dist/
            output/playwright-ci/
            quality/2026-08-14-openemr2026-s009-test-report.md
            security/2026-08-14-openemr2026-s010-security-assessment.md
